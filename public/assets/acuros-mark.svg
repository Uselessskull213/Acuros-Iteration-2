<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="gold" x1="120" y1="120" x2="880" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#D8B05A"/>
      <stop offset="0.35" stop-color="#C29638"/>
      <stop offset="0.65" stop-color="#B0842E"/>
      <stop offset="1"    stop-color="#9A7127"/>
    </linearGradient>
    <!-- one petal pointing up: two tapered calligraphic crescents meeting at tip and inner point -->
    <g id="petal">
      <!-- left crescent -->
      <path d="M 500 58
               C 368 170, 298 340, 494 480
               C 396 332, 440 176, 500 58 Z" fill="url(#gold)"/>
      <!-- right crescent (mirror) -->
      <path d="M 500 58
               C 632 170, 702 340, 506 480
               C 604 332, 560 176, 500 58 Z" fill="url(#gold)"/>
    </g>
  </defs>
  <use href="#petal"/>
  <use href="#petal" transform="rotate(90 500 500)"/>
  <use href="#petal" transform="rotate(180 500 500)"/>
  <use href="#petal" transform="rotate(270 500 500)"/>
</svg>
